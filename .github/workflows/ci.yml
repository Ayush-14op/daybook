name: CI

on:
  push:
    branches: ['**']
  pull_request:

# No macOS job and no iOS build: iOS is gated on Mac access (PLAN.md stage 7).
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Regenerates drift output so a schema change committed without running
      # codegen fails here rather than at runtime.
      - run: dart run build_runner build
      - name: Check generated files are up to date
        run: git diff --exit-code

      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows
